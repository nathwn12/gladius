<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>closed shadow root fixture</title>
<style>body { margin: 8px; font: 16px monospace; }</style>
</head>
<body>
<p id="outside">GLADIUS_CLOSED_SHADOW_FIXTURE</p>
<div id="host"></div>
<script>
  // A CLOSED shadow root: the page realm cannot see into it, so
  // document.querySelector('#inner') can never match, while the
  // accessibility tree (and therefore an AX `@eN` ref) still does.
  var host = document.getElementById('host');
  var root = host.attachShadow({ mode: 'closed' });
  // `#inner` sits under a wrapper, so a `>` at the boundary names nothing:
  // `#host > #inner` must stay the ordinary miss, while `#container #inner`
  // and `#first + #inner` live entirely inside the root and only the
  // full-selector probe can see them. `#direct` IS a direct child of the root,
  // so `#host > #direct` is a real (unreachable) target.
  root.innerHTML =
    '<div id="container">' +
      '<button id="first" style="width:120px;height:40px">FIRST_IN_CLOSED</button>' +
      '<button id="inner" style="width:120px;height:40px">CLOSED_INNER_OK</button>' +
    '</div>' +
    '<button id="direct" style="width:120px;height:40px">DIRECT_IN_CLOSED</button>';
  root.getElementById('inner').addEventListener('click', function () {
    window.__closedClicks = (window.__closedClicks || 0) + 1;
  });
  // An OPEN shadow root next to it, as the contrast case: that one IS
  // reachable through the AX ref path and is not a closed-root answer.
  var openHost = document.createElement('div');
  document.body.appendChild(openHost);
  var openRoot = openHost.attachShadow({ mode: 'open' });
  openRoot.innerHTML = '<button id="openinner" style="width:120px;height:40px">OPEN_INNER_OK</button>';
</script>
</body>
</html>
