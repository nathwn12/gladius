<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gladius freeze fixture</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font: 16px/20px sans-serif; }
  /* A same-process iframe carrying its own CSS spinner: only a walk that
     reaches into the frame can stop it. */
  #frame { position: absolute; left: 20px; top: 20px; width: 120px; height: 120px; border: 0; }
  #host { position: absolute; left: 160px; top: 20px; width: 160px; height: 60px; }
  #svgwrap { position: absolute; left: 160px; top: 100px; width: 80px; height: 80px; }
  #vid { position: absolute; left: 20px; top: 160px; width: 64px; height: 64px; }
  #spinner { position: absolute; left: 60px; top: 60px; width: 40px; height: 40px;
             background: #1e64c8; animation: spin 400ms linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<iframe id="frame" srcdoc="<!doctype html><html><head><style>html,body{margin:0;background:#fff}#s{position:absolute;left:20px;top:20px;width:60px;height:60px;background:#c81e1e;animation:sp 500ms linear infinite}@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style></head><body><div id=s></div></body></html>"></iframe>
<div id="host"></div>
<div id="svgwrap">
  <svg width="80" height="80" viewBox="0 0 80 80">
    <rect x="30" y="10" width="20" height="20" fill="#1ec84a">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40"
                        dur="1s" repeatCount="indefinite"/>
    </rect>
  </svg>
</div>
<video id="vid" muted autoplay playsinline></video>
<script>
// An open shadow root whose box is animated through WAAPI (element.animate),
// which the stylesheet cannot stop: only getAnimations().pause() can.
const host = document.getElementById('host');
const sr = host.attachShadow({ mode: 'open' });
sr.innerHTML = '<div id="box" style="width:40px;height:40px;background:#1e64c8"></div>';
const box = sr.getElementById('box');
box.animate(
  [{ transform: 'translateX(0px)' }, { transform: 'translateX(120px)' }],
  { duration: 700, iterations: Infinity, direction: 'alternate' }
);

// A genuinely playing, muted <video>. Its source is a MediaStream from a
// canvas painted once, so the element is playing (currentTime advances, the
// freeze must pause it) while its rendered frame stays constant - the pixel
// proof comes from the other motion sources, and this one proves the media
// pause happened without injecting motion of its own.
const c = document.createElement('canvas');
c.width = 64;
c.height = 64;
const g = c.getContext('2d');
g.fillStyle = '#333333';
g.fillRect(0, 0, 64, 64);
const vid = document.getElementById('vid');
if (c.captureStream) {
  vid.srcObject = c.captureStream(10);
  const p = vid.play();
  if (p && p.catch) p.catch(() => {});
}
window.__freezeReady = true;
</script>
</body>
</html>
