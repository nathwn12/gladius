[package]
name = "gladius"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Browser-use MCP server in Rust driving the owned pinned Chromium (chrome-headless-shell) over CDP - single static binary, stdio transport"
repository = "https://github.com/nathwn12/gladius"
keywords = ["mcp", "model-context-protocol", "browser-automation", "cdp", "headless-browser"]
categories = ["command-line-utilities"]
# Lockfile-coherent MSRV: the highest declared floor in the resolved graph is
# icu_collections 2.3.0 (edition 2024) at `rust-version = "1.88"`, pulled in
# transitively through reqwest -> url -> idna -> icu. A lower value here is
# incoherent with the lock; this is the true floor.
rust-version = "1.88"

[[bin]]
name = "gladius"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# `rustls-tls-native-roots` compiles the TLS transport so `wss://` attach
# endpoints work (the attach path accepts whatever the user points at), and it
# keeps ONE trust store per binary: `reqwest` 0.13 offers no bundled-roots
# feature (only `rustls` / `rustls-no-provider`, both of which pin
# `rustls-platform-verifier`), so the OS store is the only store both halves can
# share. `rustls-tls-webpki-roots` here would leave HTTP on the host store and
# WS on bundled roots. It reuses the rustls/tokio-rustls crates already in the
# tree via reqwest's rustls feature; the only addition is rustls-native-certs,
# which reqwest's own verifier already depends on for unix targets.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
# `rustls` is 0.13's only rustls transport feature besides `rustls-no-provider`
# (which drops the crypto provider). Both hard-wire `rustls-platform-verifier`,
# so HTTP trust is the OS store; the WS side is matched to it above.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Screenshot `path` writes decode the CDP base64 payload with this direct
# dep (already in the resolved tree transitively); never hand-rolled.
base64 = "0.23"

# ---------------------------------------------------------------- build speed
# Fast inner loop. `line-tables-only` keeps file:line backtraces but drops
# variable/type debuginfo. Measured (MSVC, this toolchain): dev PDB 63.2 -> 26.8 MB
# (-57.7 %) for gladius and 11,677,696 -> 6,074,368 B (-48.0 %) for puppet; dev
# target dir 774 -> 487 MB. Wall-clock effect: none measurable (see §1.3) - this
# is a disk/I-O/staging win.
[profile.dev]
debug = "line-tables-only"   # string values need Rust >=1.71; our MSRV floor is 1.88
incremental = true           # already the default; stated so nobody "optimises" it away
opt-level = 0                # already the default; keep it (see §6)

# `test` inherits `dev`, so `cargo test` gets the same treatment. Explicit for clarity.
[profile.test]
inherits = "dev"

# ---------------------------------------------------------------- release
# DELIBERATELY EMPTY: the release defaults are already the build-time-friendly
# set (opt-level=3, codegen-units=16, lto=false, panic="unwind", debug=false,
# strip="none"). Adding lto/codegen-units=1 makes builds SLOWER and changes the
# H2H-benched artifact - see §5. Do not add a [profile.release] block.
