# nathwn12 house CI — stack: rust (copy to .github/workflows/ci.yml)
# Docs-only change (*.md, docs/, LICEN[CS]E) keeps the required check green in seconds and runs no build.
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    # Merge gate: static checks only — everything here must be provable from
    # a clean checkout with no owned browser and no release build. The runtime
    # suite is the `test` job below: it provisions the pinned browser with
    # scripts/fetch-chromium.ps1 and runs `cargo test --locked`.
    # release.yml runs no cargo test at all, so CI is the only place the
    # suite is gated.
    steps:
      # Action majors were verified against the GitHub Releases API on 2026-10-17:
      # actions/checkout v7 (latest v7.0.1, published 2026-07-20) — the same
      # major the repo's other workflows already use. v4 is Node-20 and the
      # runner annotates its deprecation.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect a docs-only change
        id: scope
        shell: bash
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            changed=$(git ls-files)
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned to the crate MSRV (1.88.0, same as rust-toolchain.toml and the
      # release workflow), with the fmt + clippy components the gates need.
      - uses: dtolnay/rust-toolchain@1.88.0
        if: steps.scope.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      # Cargo registry + build cache (keyed on the lockfile): keeps the
      # typical run inside the <5 min budget.
      - name: restore cargo cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.88.0-${{ hashFiles('Cargo.lock') }}
      # Gates (cheapest first). Formatting, lint at deny-warnings, then a
      # debug-profile compile so a link/codegen break still fails the merge
      # without paying for a release build.
      - run: cargo fmt --all --check
        if: steps.scope.outputs.code == 'true'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: steps.scope.outputs.code == 'true'
      - run: cargo build --locked
        if: steps.scope.outputs.code == 'true'
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"
  # Runtime suite. The source-shape guards in tests/ and the engine tests spawn
  # the pinned headless browser, so this job provisions it with the repo's own
  # script and then runs the whole suite. 261 tests; no ambient browser, no
  # release build. A docs-only change skips every step and stays green.
  test:
    runs-on: windows-latest
    # 126 MB browser download + a from-scratch `cargo test` build + a suite that
    # took 406.7 s locally. 45 min is headroom, not a flake margin.
    timeout-minutes: 45
    steps:
      # Same action major as the build job and the repo's other workflows.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Job-scoped: a job cannot read the build job's step outputs, so the same
      # docs-only detection runs here rather than coupling the two jobs.
      - name: Detect a docs-only change
        id: scope
        shell: bash
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            changed=$(git ls-files)
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # Same pin as the build job (crate MSRV 1.88.0). No rustfmt/clippy: this
      # job only compiles and runs tests.
      - uses: dtolnay/rust-toolchain@1.88.0
        if: steps.scope.outputs.code == 'true'
      # Its own cache entry, keyed apart from the build job's `cargo-...` key, so
      # the two jobs do not evict each other's `target` on every run.
      - name: restore cargo cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-1.88.0-${{ hashFiles('Cargo.lock') }}
      # Keyed on the pin itself, never on a date: the version string below plus
      # the manifest hash. The script re-verifies every file hash on reuse and
      # refuses on mismatch, so a restored dir cannot smuggle in a wrong browser.
      - name: restore pinned browser cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\gladius\chromium
          key: chromium-win64-156.0.8078.80-${{ hashFiles('scripts/chromium-manifest.json') }}
      # chrome-headless-shell writes `debug.log` beside its own exe when it logs a
      # warning, so the tree saved back into this cache is one file larger than
      # the manifest - and fetch-chromium.ps1 (correctly) refuses an inexact set:
      # "found=289 expected=288". Drop only files the manifest does not list.
      # Every file it does list is still size- and sha256-verified by the script
      # below, and a scrub removes rather than adds, so nothing unverified can
      # survive it.
      - name: drop browser runtime by-products from the restored cache
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content scripts/chromium-manifest.json -Raw | ConvertFrom-Json
          $dir = Join-Path $env:LOCALAPPDATA ('gladius\chromium\{0}-{1}' -f $m.browser.version, $m.browser.asset.sha256.Substring(0, 8))
          if (-not (Test-Path -LiteralPath $dir)) {
            Write-Host 'pinned browser cache absent; nothing to scrub.'
            exit 0
          }
          $listed = @{}
          foreach ($f in $m.browser.files) { $listed[$f.name] = $true }
          $dropped = 0
          foreach ($file in (Get-ChildItem -File -Recurse -LiteralPath $dir)) {
            $rel = $file.FullName.Substring($dir.Length + 1).Replace('\', '/')
            if (-not $listed.ContainsKey($rel)) {
              Remove-Item -LiteralPath $file.FullName -Force
              Write-Host ("dropped runtime by-product: {0}" -f $rel)
              $dropped++
            }
          }
          Write-Host ("scrubbed {0} file(s) not in the manifest." -f $dropped)
      # Same invocation browser-update.yml uses. Idempotent: a verified cache is
      # a no-op; a missing or mismatched one downloads and verifies the pin.
      - name: provision the pinned browser
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-chromium.ps1
      - name: cargo test
        if: steps.scope.outputs.code == 'true'
        run: cargo test --locked
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the runtime suite ran' || 'docs-only - test skipped, the check stays green' }}"
