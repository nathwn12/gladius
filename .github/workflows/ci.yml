# nathwn12 house CI — stack: rust (copy to .github/workflows/ci.yml)
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    # The test suites drive a headless Chrome over CDP. The suite probes the
    # ms-playwright headless-shell path first and falls back to a system
    # Chrome; the code honours GLADIUS_CHROME, so point it at the runner's
    # preinstalled Chrome explicitly.
    env:
      GLADIUS_CHROME: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked
