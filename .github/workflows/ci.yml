# nathwn12 house CI — stack: rust (copy to .github/workflows/ci.yml)
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    # The suite drives the owned Obscura engine only: provision the pinned
    # engine with the repo's own script (sha-verified) and run against it.
    # CI must never point at a runner-provided browser.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: powershell -ExecutionPolicy Bypass -File scripts/fetch-engine.ps1
      - run: cargo build --locked
      - run: cargo test --locked
