# Staging writes only an Actions artifact: no GitHub Release page, no asset
# upload, no registry write. It hands immutable bytes to release.yml.
name: stage release
on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string
      receipt_sha256:
        required: true
        type: string
      blobs:
        description: 'Safe basenames mapped to git blob IDs; uploaded by stage-release.mjs'
        required: true
        type: string
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'nathwn12/gladius' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: verify uploaded blobs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          BLOB_MAP: ${{ inputs.blobs }}
        run: node scripts/stage-release.mjs --download staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-handoff
          path: staged/*
          if-no-files-found: error
          retention-days: 1
