# Trusted publisher identity stays release.yml. CI verifies and ships local bytes.
name: release
on:
  workflow_dispatch:
    inputs:
      product_tag:
        required: true
        type: string
        default: gladius
      commit:
        required: true
        type: string
      version:
        description: 'Assertion against committed manifests and history, never a version writer'
        required: true
        type: string
      staging_run_id:
        required: true
        type: string
      receipt_sha256:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
        default: true
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'nathwn12/gladius' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_TAG: ${{ inputs.product_tag }}
      COMMIT: ${{ inputs.commit }}
      VERSION: ${{ inputs.version }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: assert lean workflow
        run: node scripts/check-release-workflow.mjs
      - name: verify handoff and back up current product assets
        run: node scripts/publish-release.mjs --prepare
      - uses: actions/upload-artifact@v7
        if: inputs.dry_run == false
        with:
          name: product-backup
          path: release-backup/
          if-no-files-found: error
          retention-days: 90
      - name: rehearse exact tarball without publishing
        if: inputs.dry_run
        working-directory: staged
        run: npm publish "gladius-mcp-$env:VERSION.tgz" --dry-run --ignore-scripts
      - name: publish exact checked bytes
        if: inputs.dry_run == false
        run: node scripts/publish-release.mjs --publish
