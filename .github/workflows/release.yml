# gladius release: build the server runtime, publish npm.
#
# Trigger: owner pushes a `v*` tag, or dispatches the workflow to rehearse it.
# Two jobs share one tag and one commit:
#   build   (windows-latest) provisions the pinned BROWSER exactly the way
#           docs/CHROMIUM.md implies (scripts/fetch-chromium.ps1, sha-verified),
#           builds + tests the crate with the MSRV toolchain, assembles the
#           server-only runtime bundle (the browser is NEVER bundled: it is
#           fetched from Google's Chrome-for-Testing endpoint at provision
#           time), computes every hash from the REAL artifacts, and fills
#           npm/engine-manifest.json.
#   publish (ubuntu-latest) creates the current release from those artifacts,
#           publishes npm over OIDC trusted publishing (no token; provenance
#           is automatic), deletes the outgoing release, and skips a tag older
#           than the current release.
#
# workflow_dispatch is the rehearsal lane: it derives the same tag from
# inputs.version and runs the identical build + pre-publish cleanroom gate,
# then skips release creation, npm publish and outgoing-release deletion for
# as long as dry_run (default true) holds. A dry run therefore proves the
# build and the gate without touching the registry or the Releases API.
#
# Action majors were verified against the GitHub Releases API on 2026-10-17:
# checkout v7 (v7.0.1), setup-node v7 (v7.1.0), upload-artifact v7 (v7.0.2),
# download-artifact v8 (v8.0.2), softprops/action-gh-release v3 (v3.0.3).
# The toolchain is pinned to the crate MSRV (1.88), not to the action's
# floating tag.
name: release
on:
  push:
    tags:
      - 'v*'
  # Rehearsal lane. No tag exists on a dispatch, so `version` stands in for it:
  # the tag is derived as `v<version>`, which keeps every version assertion
  # below identical in both modes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, without the leading v (e.g. 0.4.4)'
        required: true
        type: string
      dry_run:
        description: 'Rehearse only: skip release creation, npm publish and outgoing-release deletion'
        required: false
        type: boolean
        default: true
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    name: build runtime + manifest
    runs-on: windows-latest
    permissions:
      contents: read
    # One tag, two triggers: a tag push names it directly, a dispatch derives
    # it from inputs.version. Every step reads this, never GITHUB_REF_NAME,
    # which on a dispatch would be the branch name.
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      # Provision the pinned browser with the repo's own script (sha-verified).
      # The suite runs against it, and the attribution copy carried below is
      # taken from these verified bytes. A release must never point at a
      # runner-provided browser, and the browser itself is never bundled.
      - name: provision pinned browser
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-chromium.ps1
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked
      - name: assemble archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Runtime bundle: the server plus the licences/notices. The browser
          # is NEVER bundled: the launcher provisions it from Google's
          # Chrome-for-Testing endpoint on first run (see npm/bin/gladius-mcp.js),
          # so no browser bytes ride the release. Attribution for the pinned
          # browser is carried as THIRD-PARTY-LICENSES/LICENSE.headless_shell,
          # copied from the provisioned (sha-verified) browser cache and
          # itself verified against the manifest before it is carried.
          $stage = "dist\gladius-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target\release\gladius.exe, LICENSE, THIRD-PARTY-NOTICES.md, README.md -Destination $stage
          New-Item -ItemType Directory -Path "$stage\THIRD-PARTY-LICENSES" -Force | Out-Null
          $cm = Get-Content scripts/chromium-manifest.json -Raw | ConvertFrom-Json
          $pinDir = "$($cm.browser.version)-$($cm.browser.asset.sha256.Substring(0,8))"
          $licName = "$($cm.browser.root)/LICENSE.headless_shell"
          $licEntry = @($cm.browser.files | Where-Object name -eq $licName)[0]
          if ($null -eq $licEntry) { throw "manifest has no entry for $licName" }
          $licSrc = Join-Path $env:LOCALAPPDATA "gladius\chromium\$pinDir\$($licName.Replace('/','\'))"
          if ((Get-Item -LiteralPath $licSrc).Length -ne $licEntry.size) { throw "provisioned LICENSE.headless_shell size drift vs manifest" }
          $licHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $licSrc).Hash.ToLowerInvariant()
          if ($licHash -ne $licEntry.sha256.ToLowerInvariant()) { throw "provisioned LICENSE.headless_shell hash drift vs manifest" }
          Copy-Item -LiteralPath $licSrc -Destination "$stage\THIRD-PARTY-LICENSES\LICENSE.headless_shell"
          Write-Host "licence attribution: $licName verified ($licHash)"
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Remove-Item -LiteralPath $stage -Recurse -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path "$stage.zip").Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $stage -Leaf).zip" | Out-File "$stage.zip.sha256" -Encoding ascii
          Write-Host "runtime: $zipHash"
      - name: assert versions + fill manifest from real artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if (-not $tag.StartsWith('v')) { throw "tag '$tag' does not start with v" }
          $ver = $tag.Substring(1)
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $ver -notmatch '^\d+\.\d+\.\d+$') { throw "dispatch version '$ver' must be X.Y.Z" }
          function Get-Sha([string]$p) { return (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLowerInvariant() }
          # 1. One version everywhere: tag == crate == npm package == manifest serverVersion.
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'cannot read crate version from Cargo.toml' }
          if ($Matches[1] -ne $ver) { throw "crate version $($Matches[1]) != tag version $ver" }
          $pkg = Get-Content npm/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $ver) { throw "npm package version $($pkg.version) != tag version $ver" }
          # Sole scripts-field exception: the global-install-refusal preinstall
          # guard (no install-time download; it only refuses `npm i -g`).
          # A postinstall download would silently never run under npx, so
          # anything beyond that single guard still fails closed.
          if ($null -ne $pkg.scripts) {
            $names = @($pkg.scripts.PSObject.Properties.Name)
            if ($names.Count -ne 1 -or $names[0] -ne 'preinstall' -or $pkg.scripts.preinstall -notmatch 'npm_config_global') {
              throw 'npm/package.json scripts field must hold only the global-install-refusal preinstall guard'
            }
          }
          $man = Get-Content npm/engine-manifest.json -Raw | ConvertFrom-Json
          if ($man.serverVersion -ne $ver) { throw "manifest serverVersion $($man.serverVersion) != tag version $ver" }
          # 2. Browser identity drift gate: the npm manifest's browser pin must
          # equal the integrity root scripts/chromium-manifest.json, agree with
          # the pin constants in scripts/fetch-chromium.ps1, and match the
          # provisioned browser bytes (checked on the exe, the security-critical file).
          $cm = Get-Content scripts/chromium-manifest.json -Raw | ConvertFrom-Json
          $pinned = $cm.browser | ConvertTo-Json -Depth 8 -Compress
          $declared = $man.browser | ConvertTo-Json -Depth 8 -Compress
          if ($pinned -ne $declared) { throw 'drift: npm/engine-manifest.json browser pin != scripts/chromium-manifest.json' }
          $ps1 = Get-Content scripts/fetch-chromium.ps1 -Raw
          foreach ($v in @($man.browser.version, $man.browser.asset.url, $man.browser.asset.sha256)) {
            if ($ps1 -notmatch [regex]::Escape($v)) { throw "drift: browser pin value not found in scripts/fetch-chromium.ps1: $v" }
          }
          foreach ($n in @("$($man.browser.asset.size)")) {
            if ($ps1 -notmatch [regex]::Escape($n)) { throw "drift: browser pin size not found in scripts/fetch-chromium.ps1: $n" }
          }
          $pinDir = "$($cm.browser.version)-$($cm.browser.asset.sha256.Substring(0,8))"
          $exeName = "$($cm.browser.root)/chrome-headless-shell.exe"
          $exeEntry = @($cm.browser.files | Where-Object name -eq $exeName)[0]
          $exePath = Join-Path $env:LOCALAPPDATA "gladius\chromium\$pinDir\$($exeName.Replace('/','\'))"
          if ((Get-Item -LiteralPath $exePath).Length -ne $exeEntry.size) { throw 'provisioned browser exe size drift vs manifest' }
          if ((Get-Sha $exePath) -ne $exeEntry.sha256.ToLowerInvariant()) { throw 'provisioned browser exe hash drift vs manifest' }
          Write-Host 'browser identity agrees: npm manifest == chromium-manifest.json == fetch-chromium.ps1 == provisioned bytes'
          # 3. Fill the release-computed hashes from the real artifacts.
          $repo = 'https://github.com/nathwn12/gladius'
          $bundle = "gladius-$tag-windows-x86_64.zip"
          $server = Get-Item -LiteralPath target\release\gladius.exe
          $man.runtime.source = "$repo/releases/download/$tag"
          $man.runtime.archive.name = $bundle
          $man.runtime.archive.sha256 = Get-Sha "dist\$bundle"
          $man.runtime.archive.size = (Get-Item -LiteralPath "dist\$bundle").Length
          $man.runtime.server.sha256 = Get-Sha $server.FullName
          $man.runtime.server.size = $server.Length
          $man | ConvertTo-Json -Depth 8 | Out-File npm/engine-manifest.json -Encoding utf8
          Copy-Item npm/engine-manifest.json dist/engine-manifest.json
          Write-Host "manifest filled for $tag"
      # Clean-room gate (pre-publish, blocking): install the staged package
      # exactly as npm would, in a scrubbed profile with empty caches, then
      # prove the engine provisions and the server boots. A package that
      # works only on a warmed machine turns the release red here, before
      # anything is published (publish needs this job).
      # --bundle feeds the gate the archive built in THIS job (dist\*.zip):
      # the GitHub Release that would serve it is created by publish, which
      # runs after this, so downloading it here can only 404. The launcher
      # still verifies the local zip's size and sha256 against the filled
      # manifest, so a wrong archive fails the gate exactly like a bad
      # download would — the check keeps its teeth. The boot still fetches
      # Chromium from Google, so this gate stays network-dependent there.
      - name: cleanroom gate (fresh-profile install + boot)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $stage = "$env:RUNNER_TEMP\cleanroom"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # npm 11 prints an array, npm 12 an object keyed by package name.
          # ConvertFrom-Json unrolls a single-element array to an object, so
          # the old branches read `id` instead of `filename`; node reads both.
          $info = npm pack --json --pack-destination $stage ./npm | Out-String
          $name = node -p "Object.values(JSON.parse(process.argv[1]))[0].filename" "$info"
          $tgz = Join-Path $stage $name
          if (-not $name -or -not (Test-Path -LiteralPath $tgz -PathType Leaf)) {
            throw "npm pack gave no tarball in $stage; raw npm output:`n$info"
          }
          $bundle = "dist\gladius-$tag-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $bundle)) { throw "built archive missing: $bundle" }
          node scripts/cleanroom-check.mjs --tarball $tgz --bundle $bundle
      # Artifacts hand files to the publish job only; retention-days: 1 keeps
      # them out of the plan allowance (no public-repo exemption).
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: github release + npm publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Same tag derivation as build; on a dispatch GITHUB_REF_NAME is the branch.
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-pkg
      - name: check stale tag
        id: release_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' | sort -V | tail -n1)
          if [ -n "$current_release" ]; then
            latest=$(printf '%s\n%s\n' "$current_release" "$RELEASE_TAG" | sort -V | tail -n1)
            if [ "$latest" != "$RELEASE_TAG" ]; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$RELEASE_TAG is older than the current release $current_release; skipping"
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      # Irreversible step 1/3: creating the public release. Skipped only on a
      # rehearsal dispatch; a tag push always runs it when the tag is current.
      - name: attach archives to the GitHub Release
        if: steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.repository.name }} ${{ env.RELEASE_TAG }}
          body: |
            Release ${{ env.RELEASE_TAG }}. See the repository CHANGELOG and the npm package for details.
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      # Provenance is automatic over OIDC: no --provenance flag, no token.
      - name: assert toolchain + versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const v=process.versions.node.split('.').map(Number); if (!(v[0]>22||(v[0]===22&&v[1]>=14))) { console.error('need node >= 22.14.0'); process.exit(1) }"
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error('need npm >= 11.5.1'); process.exit(1) }"
          test "$(node -p "require('./npm-pkg/package.json').version")" = "${RELEASE_TAG#v}" || { echo "npm package version != tag version"; exit 1; }
          node -e "for (const f of ['./npm-pkg/package.json','./npm-pkg/engine-manifest.json','./npm-pkg/bin/gladius-mcp.js']) require('fs').accessSync(f); const p=require('./npm-pkg/package.json'); if (p.scripts!==undefined && (Object.keys(p.scripts).join(',')!=='preinstall' || !/npm_config_global/.test(p.scripts.preinstall))) { console.error('scripts field holds more than the preinstall global-refusal guard'); process.exit(1) }; const m=require('./npm-pkg/engine-manifest.json'); if (m.serverVersion!==p.version) { console.error('serverVersion != package version'); process.exit(1) }; for (const s of [m.runtime.archive.sha256, m.runtime.server.sha256, m.browser.asset.sha256]) if (!/^[0-9a-f]{64}$/.test(s)) { console.error('manifest still has placeholder hashes'); process.exit(1) }; if (!Array.isArray(m.browser.files) || m.browser.files.length!==m.browser.fileCount) { console.error('browser file list != fileCount'); process.exit(1) }; console.log('npm package OK: no scripts field, serverVersion matches, all release hashes filled, browser pin complete')"
      - name: assert packaged manifest matches built assets
        shell: bash
        run: |
          set -euo pipefail
          # Prove what will actually be published: pack the staged
          # directory, read engine-manifest.json from the TARBALL (not the
          # working tree), and require its hashes to equal the release
          # manifest produced by this same run (dist/engine-manifest.json).
          mkdir -p "$RUNNER_TEMP/packed"
          info="$(npm pack --json --pack-destination "$RUNNER_TEMP/packed" ./npm-pkg)"
          tgz="$RUNNER_TEMP/packed/$(node -p "JSON.parse(process.argv[1])[0].filename" "$info")"
          tar -xzf "$tgz" -O package/engine-manifest.json > "$RUNNER_TEMP/packed/manifest.json"
          node -e "
            const fs = require('fs');
            const packed = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const built = JSON.parse(fs.readFileSync('dist/engine-manifest.json', 'utf8'));
            for (const f of ['runtime.archive.sha256', 'runtime.server.sha256']) {
              const get = (o) => f.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
              if (get(packed) !== get(built)) {
                console.error('::error::packaged manifest does not match the built assets (' + f + ': tarball ' + get(packed) + ' != release ' + get(built) + ')');
                process.exit(1);
              }
            }
            console.log('packaged manifest matches built assets: ' + built.runtime.archive.sha256.slice(0, 12) + '… / ' + built.runtime.server.sha256.slice(0, 12) + '…');
          " "$RUNNER_TEMP/packed/manifest.json"
      # Irreversible step 2/3: npm publish. Same guard: rehearsal dispatch only.
      - name: publish to npm (OIDC trusted publishing)
        id: publish_npm
        if: steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./npm-pkg/package.json').name")
          version="${RELEASE_TAG#v}"
          tag="$RELEASE_TAG"
          if grep -q "RELEASE_WORKFLOW_FILLS_THIS" ./npm-pkg/engine-manifest.json; then
            echo "::error::engine-manifest.json still contains placeholder RELEASE_WORKFLOW_FILLS_THIS"
            exit 1
          fi
          man_ver=$(node -p "require('./npm-pkg/engine-manifest.json').serverVersion")
          if [ "$man_ver" != "$version" ]; then
            echo "::error::manifest serverVersion $man_ver != tag version $version"
            exit 1
          fi
          node -e "const m=require('./npm-pkg/engine-manifest.json'); const tag=process.env.RELEASE_TAG; const src=(m.runtime&&m.runtime.source)||''; const arc=(m.runtime&&m.runtime.archive&&m.runtime.archive.name)||''; if(!src.includes(tag)||!arc.includes(tag)){ console.error('::error::manifest runtime.source/archive do not name tag '+tag+': '+src+' / '+arc); process.exit(1); } console.log('manifest OK: serverVersion '+m.serverVersion+', runtime '+src+' / '+arc)"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            published="$(npm view "$pkg@$version" version)"
            tarball="$(npm view "$pkg@$version" dist.tarball)"
            echo "$pkg@$version already published (registry reports $published): $tarball; skipping npm publish"
            exit 0
          fi
          npm publish ./npm-pkg
          published_ok=0
          for i in $(seq 1 12); do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then published_ok=1; break; fi
            sleep 15
          done
          if [ "$published_ok" -eq 1 ]; then
            echo "verified: $pkg@$version is resolvable"
            npm view "$pkg@$version" dist.tarball dist.integrity
          else
            echo "::warning::$pkg@$version uploaded but still in npm validation after 3 minutes; treating as published"
          fi
      # Irreversible step 3/3: deleting every other published release. Same
      # guard; `always()` keeps it running after a failed publish on a tag push.
      - name: delete outgoing releases
        if: always() && steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "current release $RELEASE_TAG is missing; keeping outgoing releases"
            exit 0
          fi
          pkg=$(node -p "require('./npm-pkg/package.json').name")
          version="${RELEASE_TAG#v}"
          if [ "${{ steps.publish_npm.outcome }}" != "success" ] && ! npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "$pkg@$version is not live; keeping outgoing releases"
            exit 0
          fi
          # One pinned release per repo: delete every other published release (tags stay).
          # The current release was created above; npm publish has succeeded.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' |
            while read -r tag; do
              if [ "$tag" = "$RELEASE_TAG" ]; then continue; fi
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
            done
  cleanroom-public:
    name: cleanroom gate (public registry)
    needs: [publish]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # This job proves the PUBLISHED package installs from the public registry,
    # so it has nothing to prove on a rehearsal that deliberately published
    # nothing (it would only 404). A tag push always runs it.
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Post-publish gate (blocking): install the LIVE package from the
      # public registry in a scrubbed profile with empty caches, then prove
      # the engine provisions and the server boots. The version comes from
      # the tag (pwsh syntax: pwsh is the default shell on windows-latest).
      - name: cleanroom gate (registry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RELEASE_TAG.StartsWith('v')) { throw "tag '$env:RELEASE_TAG' does not start with v" }
          $ver = $env:RELEASE_TAG.Substring(1)
          node scripts/cleanroom-check.mjs --registry --version $ver
